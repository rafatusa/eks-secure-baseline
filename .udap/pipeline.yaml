version: 1
name: eks-secure-baseline
vcs: github

stages:
  - id: lint
    kind: lint
    timeout_minutes: 10
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: infra
      - name: Terraform validate
        run: terraform validate
        working-directory: infra
      - name: Shell script syntax check
        run: |
          for script in scripts/*.sh; do
            echo "checking $script"
            bash -n "$script"
          done
      - name: Python report builder syntax check
        run: python3 -m py_compile scripts/build_report.py
      - name: Install kubeconform
        run: |
          set -euo pipefail
          # -f makes curl fail on an HTTP error instead of writing the error
          # page to disk, where tar would later die on "not in gzip format".
          # /releases/latest/download/ resolves to the current release, so a
          # pinned tag that is later yanked cannot 404 this step.
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -skip CustomResourceDefinition k8s/

  - id: security
    kind: security
    needs: [lint]
    timeout_minutes: 15
    steps:
      - name: Install Trivy
        run: |
          set -euo pipefail
          # Install from the .deb package rather than a tarball: apt verifies
          # the archive, so a truncated or HTML-bodied download fails loudly
          # here instead of producing a corrupt binary.
          # Version verified to exist before pinning; a yanked release is what
          # broke the previous attempt.
          TRIVY_VERSION="0.74.0"
          curl -fsSL -o /tmp/trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i /tmp/trivy.deb
          trivy --version
      - name: Scan Terraform for misconfiguration
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 infra/
      - name: Scan Kubernetes manifests for misconfiguration
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 k8s/

  - id: provision
    kind: provision
    needs: [security]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
        working-directory: infra
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: infra

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster }}"
      - name: Wait for nodes to be ready
        run: kubectl wait --for=condition=Ready nodes --all --timeout=600s
      - name: Apply hardening baseline
        run: kubectl apply -f k8s/hardening/
      - name: Apply compliance scanning resources
        run: kubectl apply -f k8s/compliance/

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster }}"
      - name: Verify cluster health
        run: kubectl get nodes -o wide
      - name: Verify control plane readiness
        run: kubectl get --raw='/readyz?verbose'
      - name: Verify hardening policies applied
        run: kubectl get networkpolicy,resourcequota -A
      - name: Verify hardening is enforced
        run: bash scripts/verify-pss.sh

  - id: compliance
    kind: custom
    needs: [verify]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.74.0"
          curl -fsSL -o /tmp/trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i /tmp/trivy.deb
          trivy --version
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name "${{ steps.tf.outputs.cluster }}"
      - name: Run kube-bench CIS EKS scan
        run: bash scripts/run-kube-bench.sh
      - name: Run Trivy cluster misconfiguration scan
        run: bash scripts/run-trivy-cluster.sh
      - name: Generate compliance report
        run: bash scripts/generate-report.sh
      - name: Print compliance summary
        run: cat reports/summary.txt
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: reports/
          retention-days: 90

rollback:
  strategy: manual

destroy:
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    AWS_DEFAULT_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_aws_region: us-east-1
    TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
    TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.8"
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: "v1.33.0"
    - name: Terraform init
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
      working-directory: infra
    - name: Configure kubectl for pre-destroy cleanup
      run: |
        CLUSTER=$(cd infra && terraform output -raw cluster_name 2>/dev/null || echo "")
        if [ -n "$CLUSTER" ]; then
          echo "::add-mask::$CLUSTER"
          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER" || true
        else
          echo "No cluster in state; pre-destroy cleanup will no-op."
        fi
    - name: Delete Kubernetes load balancers before destroy
      run: bash scripts/pre-destroy-cleanup.sh
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
