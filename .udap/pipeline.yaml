version: 1
name: eks-secure-baseline
vcs: github

stages:
  - id: lint
    kind: lint
    timeout_minutes: 10
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: infra
      - name: Terraform validate
        run: terraform validate
        working-directory: infra
      - name: Shell script syntax check
        run: |
          for script in scripts/*.sh; do
            echo "checking $script"
            bash -n "$script"
          done
      - name: Python report builder syntax check
        run: python3 -m py_compile scripts/build_report.py
      - name: Install kubeconform
        run: |
          set -euo pipefail
          # -f makes curl fail on an HTTP error instead of writing the error
          # page to disk, where tar would later die on "not in gzip format".
          # /releases/latest/download/ resolves to the current release, so a
          # pinned tag that is later yanked cannot 404 this step.
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -skip CustomResourceDefinition k8s/

  - id: security
    kind: security
    needs: [lint]
    timeout_minutes: 15
    steps:
      - name: Install Trivy
        run: |
          set -euo pipefail
          # Install from the .deb package rather than a tarball: apt verifies
          # the archive, so a truncated or HTML-bodied download fails loudly
          # here instead of producing a corrupt binary.
          # Version verified to exist before pinning; a yanked release is what
          # broke the first deploy attempt.
          TRIVY_VERSION="0.74.0"
          curl -fsSL -o /tmp/trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i /tmp/trivy.deb
          trivy --version

      - name: Show all findings (informational, does not gate)
        run: |
          # Printed BEFORE the gating scans so any failure below is
          # diagnosable from this log alone, with NO ignore files applied —
          # this is the unfiltered truth about the repository.
          # --exit-code 0: this step reports, it never decides.
          echo "::group::Terraform — all findings, no suppressions"
          trivy config --exit-code 0 infra/
          echo "::endgroup::"
          echo "::group::Kubernetes — all findings, no suppressions"
          trivy config --exit-code 0 k8s/
          echo "::endgroup::"

      # ---------------------------------------------------------------
      # GATING SCANS
      #
      # Split by scan target so a suppression can NEVER leak outside the
      # directory it was reviewed for. Scoping is enforced by the scan
      # invocation (which ignore file is passed), not by per-entry path
      # syntax inside the ignore file.
      #
      #   infra/           -> .trivyignore             (AWS-0104 only)
      #   k8s/hardening/   -> NO ignore file           (fully gated)
      #   k8s/compliance/  -> .trivyignore-kube-bench  (scanner Job only)
      #
      # All three keep --severity HIGH,CRITICAL --exit-code 1.
      # ---------------------------------------------------------------
      - name: Scan Terraform for misconfiguration
        run: trivy config --ignorefile .trivyignore --severity HIGH,CRITICAL --exit-code 1 infra/

      - name: Scan Kubernetes hardening manifests (no suppressions)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 k8s/hardening/

      - name: Scan kube-bench scanner Job (scanner-specific suppressions)
        run: trivy config --ignorefile .trivyignore-kube-bench --severity HIGH,CRITICAL --exit-code 1 k8s/compliance/

  - id: provision
    kind: provision
    needs: [security]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
        working-directory: infra
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: infra

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Configure cluster under temporary API access
        run: |
          bash scripts/ci-api-access.sh \
            "${{ steps.tf.outputs.cluster }}" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
            -- bash scripts/configure-cluster.sh

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Verify cluster under temporary API access
        run: |
          bash scripts/ci-api-access.sh \
            "${{ steps.tf.outputs.cluster }}" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
            -- bash scripts/verify-cluster.sh "${{ steps.tf.outputs.cluster }}" us-east-1

  - id: compliance
    kind: custom
    needs: [verify]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.74.0"
          curl -fsSL -o /tmp/trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i /tmp/trivy.deb
          trivy --version
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Run compliance scans under temporary API access
        run: |
          bash scripts/ci-api-access.sh \
            "${{ steps.tf.outputs.cluster }}" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
            -- bash scripts/run-compliance.sh
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: reports/
          retention-days: 90

rollback:
  strategy: manual

destroy:
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    AWS_DEFAULT_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_aws_region: us-east-1
    TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
    TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.8"
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: "v1.33.0"
    - name: Terraform init
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
      working-directory: infra
    - name: Delete Kubernetes load balancers before destroy
      run: |
        # The API allowlist is locked to one administrative host, so the
        # destroy runner must admit itself before it can delete the
        # Kubernetes LoadBalancer Services. Without this the cleanup would
        # time out, silently skip, and leave orphaned ALBs holding ENIs that
        # block DeleteVpc — the exact failure pattern observed in this AWS
        # account before the project was built.
        CLUSTER=$(cd infra && terraform output -raw cluster_name 2>/dev/null || echo "")
        if [ -n "$CLUSTER" ]; then
          echo "::add-mask::$CLUSTER"
          bash scripts/ci-api-access.sh \
            "$CLUSTER" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
            -- bash scripts/pre-destroy-cleanup.sh
        else
          echo "No cluster in state; pre-destroy cleanup skipped."
        fi
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
