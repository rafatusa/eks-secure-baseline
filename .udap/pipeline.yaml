version: 1
name: eks-secure-baseline
vcs: github

stages:
  - id: lint
    kind: lint
    timeout_minutes: 10
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: infra
      - name: Terraform validate
        run: terraform validate
        working-directory: infra
      - name: Shell script syntax check
        run: |
          for script in scripts/*.sh; do
            echo "checking $script"
            bash -n "$script"
          done
      - name: Python report builder syntax check
        run: python3 -m py_compile scripts/build_report.py
      - name: Install kubeconform
        run: |
          set -euo pipefail
          # -f makes curl fail on an HTTP error instead of writing the error
          # page to disk, where tar would later die on "not in gzip format".
          # /releases/latest/download/ resolves to the current release, so a
          # pinned tag that is later yanked cannot 404 this step.
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          # k8s/hardening and k8s/compliance are applied as committed and are
          # validated directly.
          kubeconform -strict -summary -skip CustomResourceDefinition \
            k8s/hardening/ k8s/compliance/

          # k8s/app carries IMAGE_PLACEHOLDER / VERSION_PLACEHOLDER /
          # VPC_CIDR_PLACEHOLDER, substituted at deploy time by
          # scripts/deploy-app.sh. The placeholders are schema-valid strings
          # so these files validate as-is, but the CIDR one is not a valid
          # ipBlock, so render a copy with throwaway values first. This
          # validates the STRUCTURE the cluster will actually receive rather
          # than the template.
          rendered="$(mktemp -d)"
          cp k8s/app/*.yaml "$rendered/"
          sed -i \
            -e 's|IMAGE_PLACEHOLDER|example.com/app:validation|g' \
            -e 's|VERSION_PLACEHOLDER|validation|g' \
            -e 's|VPC_CIDR_PLACEHOLDER|10.20.0.0/16|g' \
            "$rendered"/*.yaml
          kubeconform -strict -summary -skip CustomResourceDefinition "$rendered/"

  - id: security
    kind: security
    needs: [lint]
    timeout_minutes: 15
    steps:
      - name: Install Trivy
        run: |
          set -euo pipefail
          # Install from the .deb package rather than a tarball: apt verifies
          # the archive, so a truncated or HTML-bodied download fails loudly
          # here instead of producing a corrupt binary.
          # Version verified to exist before pinning; a yanked release is what
          # broke the first deploy attempt.
          TRIVY_VERSION="0.74.0"
          curl -fsSL -o /tmp/trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i /tmp/trivy.deb
          trivy --version

      - name: Show all findings (informational, does not gate)
        run: |
          # Printed BEFORE the gating scans so any failure below is
          # diagnosable from this log alone, with NO ignore files applied —
          # this is the unfiltered truth about the repository.
          # --exit-code 0: this step reports, it never decides.
          echo "::group::Terraform — all findings, no suppressions"
          trivy config --exit-code 0 infra/
          echo "::endgroup::"
          echo "::group::Kubernetes — all findings, no suppressions"
          trivy config --exit-code 0 k8s/
          echo "::endgroup::"

      # ---------------------------------------------------------------
      # GATING SCANS
      #
      # Split by scan target so a suppression can NEVER leak outside the
      # directory it was reviewed for. Scoping is enforced by the scan
      # invocation (which ignore file is passed), not by per-entry path
      # syntax inside the ignore file.
      #
      #   infra/           -> .trivyignore             (AWS-0040/0041/0104)
      #   k8s/hardening/   -> NO ignore file           (fully gated)
      #   k8s/app/         -> NO ignore file           (fully gated)
      #   k8s/compliance/  -> .trivyignore-kube-bench  (scanner Job only)
      #
      # All four keep --severity HIGH,CRITICAL --exit-code 1.
      # ---------------------------------------------------------------
      - name: Scan Terraform for misconfiguration
        run: trivy config --ignorefile .trivyignore --severity HIGH,CRITICAL --exit-code 1 infra/

      - name: Scan Kubernetes hardening manifests (no suppressions)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 k8s/hardening/

      - name: Scan application manifests (no suppressions)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 k8s/app/

      - name: Scan kube-bench scanner Job (scanner-specific suppressions)
        run: trivy config --ignorefile .trivyignore-kube-bench --severity HIGH,CRITICAL --exit-code 1 k8s/compliance/

      - name: Scan the application Dockerfile
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 app/

  - id: provision
    kind: provision
    needs: [security]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
        working-directory: infra
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: infra

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          set -euo pipefail
          # scripts/tf-output.sh, not a bare `terraform output`: that command
          # exits 0 and prints the placeholder `<cluster_name>` when the state
          # has no outputs, so a plain `|| echo ""` guard passes the
          # placeholder downstream as if it were real.
          CLUSTER="$(bash scripts/tf-output.sh cluster_name infra)"
          if [ -z "$CLUSTER" ]; then
            echo "ERROR: cluster_name is not present in terraform state." >&2
            echo "Provision must run before configure." >&2
            exit 1
          fi
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
      - name: Configure cluster under temporary API access
        run: |
          bash scripts/ci-api-access.sh \
            "${{ steps.tf.outputs.cluster }}" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
            -- bash scripts/configure-cluster.sh "${{ steps.tf.outputs.cluster }}" us-east-1

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          set -euo pipefail
          CLUSTER="$(bash scripts/tf-output.sh cluster_name infra)"
          if [ -z "$CLUSTER" ]; then
            echo "ERROR: cluster_name is not present in terraform state." >&2
            exit 1
          fi
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
      - name: Verify cluster under temporary API access
        run: |
          bash scripts/ci-api-access.sh \
            "${{ steps.tf.outputs.cluster }}" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
            -- bash scripts/verify-cluster.sh "${{ steps.tf.outputs.cluster }}" us-east-1

  - id: compliance
    kind: custom
    needs: [verify]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.33.0"
      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.74.0"
          curl -fsSL -o /tmp/trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i /tmp/trivy.deb
          trivy --version
      - name: Terraform init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
        working-directory: infra
      - name: Read cluster name from state
        id: tf
        run: |
          set -euo pipefail
          CLUSTER="$(bash scripts/tf-output.sh cluster_name infra)"
          if [ -z "$CLUSTER" ]; then
            echo "ERROR: cluster_name is not present in terraform state." >&2
            exit 1
          fi
          echo "::add-mask::$CLUSTER"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
      - name: Run compliance scans under temporary API access
        run: |
          bash scripts/ci-api-access.sh \
            "${{ steps.tf.outputs.cluster }}" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
            -- bash scripts/run-compliance.sh
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: reports/
          retention-days: 90

# ---------------------------------------------------------------------------
# EXTRA WORKFLOW: application release.
#
# Rendered to .github/workflows/app-deploy.yml as its own workflow_dispatch
# workflow. It is INDEPENDENT of the deploy backbone above: it never runs
# terraform apply and never touches cluster-wide configuration, so shipping a
# new application version cannot disturb the compliance baseline or the
# cluster's hardening.
#
# It DOES run terraform init + output (read-only) because several values it
# needs — the ECR repository URL, the VPC CIDR, the cluster name — live in
# state and must not be threaded through job outputs: they embed the project
# name, which is a secret, and GitHub silently drops job outputs containing
# secret substrings.
# ---------------------------------------------------------------------------
pipelines:
  - id: app-deploy
    stages:
      - id: build
        kind: build
        timeout_minutes: 20
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              # Spring Boot 3.5.x has a Java 17 baseline and supports 21; 21
              # (current LTS) is pinned deliberately. This must match the
              # Dockerfile base images and <release> in pom.xml; a drift shows
              # up as a compile error or UnsupportedClassVersionError at
              # runtime, neither of which names the version pin that caused it.
              java-version: "21"
              distribution: temurin
              cache: maven
          - name: Build and test
            # `verify` runs the full test suite. The tests assert the landing
            # page renders, the probe endpoints exist, and the sensitive
            # actuator endpoints stay unexposed — the last of which is a
            # security control, not a feature.
            run: mvn -B verify
            working-directory: app

      - id: image
        kind: build_push
        needs: [build]
        timeout_minutes: 25
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
          TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.9.8"
          - name: Terraform init
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
            working-directory: infra
          - name: Build, scan and push the image
            # One step so the image reference never has to cross a job
            # boundary: the ECR URL embeds the account id and project name,
            # and a job output carrying it would be silently dropped.
            run: bash scripts/build-push-image.sh "${{ github.sha }}"

      - id: deploy
        kind: custom
        needs: [image]
        timeout_minutes: 25
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
          TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.9.8"
          - name: Set up kubectl
            uses: azure/setup-kubectl@v3
            with:
              version: "v1.33.0"
          - name: Terraform init
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
            working-directory: infra
          - name: Read cluster name and image reference from state
            id: tf
            run: |
              set -euo pipefail
              CLUSTER="$(bash scripts/tf-output.sh cluster_name infra)"
              if [ -z "$CLUSTER" ]; then
                echo "ERROR: cluster_name is not present in terraform state." >&2
                echo "The cluster must be provisioned before deploying the app." >&2
                exit 1
              fi
              echo "::add-mask::$CLUSTER"
              echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
          - name: Deploy the application under temporary API access
            run: |
              set -euo pipefail
              ECR_URL="$(bash scripts/tf-output.sh ecr_repository_url infra)"
              if [ -z "$ECR_URL" ]; then
                echo "ERROR: ecr_repository_url is not present in terraform state." >&2
                exit 1
              fi
              echo "::add-mask::$ECR_URL"
              bash scripts/ci-api-access.sh \
                "${{ steps.tf.outputs.cluster }}" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
                -- bash scripts/deploy-app.sh "${ECR_URL}:${{ github.sha }}" "${{ github.sha }}"

      - id: verify-app
        kind: verify
        needs: [deploy]
        timeout_minutes: 25
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
          TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.9.8"
          - name: Set up kubectl
            uses: azure/setup-kubectl@v3
            with:
              version: "v1.33.0"
          - name: Terraform init
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
            working-directory: infra
          - name: Read cluster name from state
            id: tf
            run: |
              set -euo pipefail
              CLUSTER="$(bash scripts/tf-output.sh cluster_name infra)"
              if [ -z "$CLUSTER" ]; then
                echo "ERROR: cluster_name is not present in terraform state." >&2
                exit 1
              fi
              echo "::add-mask::$CLUSTER"
              echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
          - name: Verify the public endpoint under temporary API access
            run: |
              bash scripts/ci-api-access.sh \
                "${{ steps.tf.outputs.cluster }}" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
                -- bash scripts/verify-app.sh

rollback:
  strategy: manual

destroy:
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: us-east-1
    AWS_DEFAULT_REGION: us-east-1
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_aws_region: us-east-1
    TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
    TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.8"
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: "v1.33.0"
    - name: Terraform init
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=us-east-1"
      working-directory: infra
    - name: Delete Kubernetes load balancers before destroy
      run: |
        set -euo pipefail
        # The API allowlist is locked to one administrative host, so the
        # destroy runner must admit itself before it can delete the
        # Kubernetes LoadBalancer Services and Ingresses. Without this the
        # cleanup would time out, silently skip, and leave orphaned ALBs
        # holding ENIs that block DeleteVpc — the exact failure pattern
        # observed in this AWS account before the project was built.
        #
        # pre-destroy-cleanup.sh deletes BOTH LoadBalancer Services and
        # Ingress resources across all namespaces, then waits for the AWS
        # load balancers to actually disappear, so the app's Ingress-created
        # ALB is covered with no extra wiring.
        #
        # RESUMED TEARDOWNS: when a previous destroy already removed the
        # cluster, the state keeps its remaining resources but loses its
        # outputs. `terraform output -raw cluster_name` then EXITS 0 and
        # prints the placeholder `<cluster_name>`, so the obvious
        # `|| echo ""` guard does NOT catch it and the placeholder is passed
        # on as a cluster name. scripts/tf-output.sh validates the VALUE and
        # returns empty in that case, so cleanup is correctly skipped and
        # terraform destroy still runs — which is the whole point of this
        # job. This is a SKIP, never a failure: there is no cluster left to
        # clean up, and nothing must stand between a resumed teardown and
        # the destroy step below.
        CLUSTER="$(bash scripts/tf-output.sh cluster_name infra)"
        if [ -n "$CLUSTER" ]; then
          echo "::add-mask::$CLUSTER"
          bash scripts/ci-api-access.sh \
            "$CLUSTER" us-east-1 "${{ secrets.API_ALLOWED_CIDR }}" \
            -- bash scripts/pre-destroy-cleanup.sh
        else
          echo "==> No cluster_name in terraform state; in-cluster cleanup skipped."
          echo "    Normal when resuming a teardown that already removed the"
          echo "    cluster. Proceeding directly to terraform destroy."
        fi
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
