        \ loudly\n# here instead of producing a corrupt binary.\n# Version verified\
        \ to exist before pinning; a yanked release is what\n# broke the first deploy\
        \ attempt.\nTRIVY_VERSION=\"0.74.0\"\ncurl -fsSL -o /tmp/trivy.deb \\\n  \"\
