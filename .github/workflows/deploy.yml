      working-directory: infra
    - name: Terraform validate
      run: terraform validate
      working-directory: infra
    - name: Shell script syntax check
      run: "for script in scripts/*.sh; do\n  echo \"checking $script\"\n  bash -n\
        \ \"$script\"\ndone\n"
    - name: Python report builder syntax check
      run: python3 -m py_compile scripts/build_report.py
    - name: Install kubeconform
      run: "set -euo pipefail\n# -f makes curl fail on an HTTP error instead of writing\
        \ the error\n# page to disk, where tar would later die on \"not in gzip format\"\
        .\n# /releases/latest/download/ resolves to the current release, so a\n# pinned\
        \ tag that is later yanked cannot 404 this step.\ncurl -fsSL -o /tmp/kubeconform.tar.gz\
        \ \\\n  \"https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz\"\
        \ntar -xzf /tmp/kubeconform.tar.gz -C /tmp\nsudo install -m 0755 /tmp/kubeconform\
        \ /usr/local/bin/kubeconform\nkubeconform -v\n"
    - name: Validate Kubernetes manifests
      run: "set -euo pipefail\n# k8s/hardening and k8s/compliance are applied as committed\
        \ and are\n# validated directly.\nkubeconform -strict -summary -skip CustomResourceDefinition\
        \ \\\n  k8s/hardening/ k8s/compliance/\n\n# k8s/app carries IMAGE_PLACEHOLDER\
        \ / VERSION_PLACEHOLDER /\n# VPC_CIDR_PLACEHOLDER, substituted at deploy time\
        \ by\n# scripts/deploy-app.sh. The placeholders are schema-valid strings\n\
        # so these files validate as-is, but the CIDR one is not a valid\n# ipBlock,\
        \ so render a copy with throwaway values first. This\n# validates the STRUCTURE\
        \ the cluster will actually receive rather\n# than the template.\nrendered=\"\
        $(mktemp -d)\"\ncp k8s/app/*.yaml \"$rendered/\"\nsed -i \\\n  -e 's|IMAGE_PLACEHOLDER|example.com/app:validation|g'\
        \ \\\n  -e 's|VERSION_PLACEHOLDER|validation|g' \\\n  -e 's|VPC_CIDR_PLACEHOLDER|10.20.0.0/16|g'\
        \ \\\n  \"$rendered\"/*.yaml\nkubeconform -strict -summary -skip CustomResourceDefinition\
        \ \"$rendered/\"\n"
  security:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install Trivy
      run: "set -euo pipefail\n# Install from the .deb package rather than a tarball:\
