        \nsudo dpkg -i /tmp/trivy.deb\ntrivy --version\n"
    - name: Show all findings (informational, does not gate)
      run: "# Printed BEFORE the gating scans so any failure below is\n# diagnosable\
        \ from this log alone, with NO ignore files applied \u2014\n# this is the\
        \ unfiltered truth about the repository.\n# --exit-code 0: this step reports,\
