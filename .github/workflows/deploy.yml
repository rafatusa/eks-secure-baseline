        \ \"$script\"\ndone\n"
    - name: Python report builder syntax check
      run: python3 -m py_compile scripts/build_report.py
    - name: Validate Kubernetes manifests
      run: 'curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz

        tar -xzf /tmp/kubeconform.tar.gz -C /tmp

        /tmp/kubeconform -strict -summary -skip CustomResourceDefinition k8s/

        '
  security:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install Trivy
      run: 'curl -sSLo /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.56.2/trivy_0.56.2_Linux-64bit.tar.gz

        tar -xzf /tmp/trivy.tar.gz -C /tmp

        sudo mv /tmp/trivy /usr/local/bin/trivy

        trivy --version

        '
    - name: Scan Terraform for misconfiguration
