name: destroy
'on':
  workflow_dispatch: {}
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: v1.33.0
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Delete Kubernetes load balancers before destroy
      run: "set -euo pipefail\n# The API allowlist is locked to one administrative\
        \ host, so the\n# destroy runner must admit itself before it can delete the\n\
        # Kubernetes LoadBalancer Services and Ingresses. Without this the\n# cleanup\
        \ would time out, silently skip, and leave orphaned ALBs\n# holding ENIs that\
        \ block DeleteVpc \u2014 the exact failure pattern\n# observed in this AWS\
        \ account before the project was built.\n#\n# pre-destroy-cleanup.sh deletes\
        \ BOTH LoadBalancer Services and\n# Ingress resources across all namespaces,\
        \ then waits for the AWS\n# load balancers to actually disappear, so the app's\
        \ Ingress-created\n# ALB is covered with no extra wiring.\n#\n# RESUMED TEARDOWNS\
        \ \u2014 why this reads the output through a helper:\n# once a previous destroy\
        \ has removed aws_eks_cluster.main, the\n# output `cluster_name` (which references\
        \ that resource) can no\n# longer be evaluated. terraform then prints a MULTI-LINE\n\
        # \"Warning: No outputs found\" banner and EXITS 0 \u2014 and because the\n\
        # setup-terraform wrapper merges stderr into stdout, that banner\n# lands\
        \ where the value was expected. Neither `2>/dev/null` nor\n# `|| echo \"\"\
        ` catches it, and the banner gets passed on as a\n# cluster name. scripts/tf-output.sh\
        \ validates the VALUE (single\n# line, identifier-shaped) and returns empty\
        \ instead, so cleanup is\n# correctly SKIPPED and terraform destroy still\
        \ runs \u2014 which is the\n# whole point of this job. A missing cluster here\
        \ is a SKIP, never a\n# failure: nothing may stand between a resumed teardown\
        \ and destroy.\nCLUSTER=\"$(bash scripts/tf-output.sh cluster_name infra)\"\
        \nif [ -n \"$CLUSTER\" ]; then\n  echo \"::add-mask::$CLUSTER\"\n  bash scripts/ci-api-access.sh\
        \ \\\n    \"$CLUSTER\" us-east-1 \"${{ secrets.API_ALLOWED_CIDR }}\" \\\n\
        \    -- bash scripts/pre-destroy-cleanup.sh\nelse\n  echo \"==> No cluster_name\
        \ in terraform state; in-cluster cleanup skipped.\"\n  echo \"    Normal when\
        \ resuming a teardown that already removed the\"\n  echo \"    cluster. Proceeding\
        \ directly to terraform destroy.\"\nfi\n"
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
