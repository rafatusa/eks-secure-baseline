name: destroy
'on':
  workflow_dispatch: {}
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: v1.33.0
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Configure kubectl for pre-destroy cleanup
      run: "CLUSTER=$(cd infra && terraform output -raw cluster_name 2>/dev/null ||\
        \ echo \"\")\nif [ -n \"$CLUSTER\" ]; then\n  echo \"::add-mask::$CLUSTER\"\
        \n  aws eks update-kubeconfig --region us-east-1 --name \"$CLUSTER\" || true\n\
        else\n  echo \"No cluster in state; pre-destroy cleanup will no-op.\"\nfi\n"
    - name: Delete Kubernetes load balancers before destroy
      run: bash scripts/pre-destroy-cleanup.sh
