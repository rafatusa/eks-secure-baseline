name: destroy
'on':
  workflow_dispatch: {}
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_api_allowed_cidr: ${{ secrets.API_ALLOWED_CIDR }}
      TF_VAR_billing_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: v1.33.0
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Delete Kubernetes load balancers before destroy
      run: "# The API allowlist is locked to one administrative host, so the\n# destroy\
        \ runner must admit itself before it can delete the\n# Kubernetes LoadBalancer\
        \ Services and Ingresses. Without this the\n# cleanup would time out, silently\
        \ skip, and leave orphaned ALBs\n# holding ENIs that block DeleteVpc \u2014\
        \ the exact failure pattern\n# observed in this AWS account before the project\
        \ was built.\n#\n# pre-destroy-cleanup.sh deletes BOTH LoadBalancer Services\
        \ and\n# Ingress resources across all namespaces, then waits for the AWS\n\
        # load balancers to actually disappear, so the app's Ingress-created\n# ALB\
        \ is covered with no extra wiring.\nCLUSTER=$(cd infra && terraform output\
        \ -raw cluster_name 2>/dev/null || echo \"\")\nif [ -n \"$CLUSTER\" ]; then\n\
        \  echo \"::add-mask::$CLUSTER\"\n  bash scripts/ci-api-access.sh \\\n   \
        \ \"$CLUSTER\" us-east-1 \"${{ secrets.API_ALLOWED_CIDR }}\" \\\n    -- bash\
        \ scripts/pre-destroy-cleanup.sh\nelse\n  echo \"No cluster in state; pre-destroy\
        \ cleanup skipped.\"\nfi\n"
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
