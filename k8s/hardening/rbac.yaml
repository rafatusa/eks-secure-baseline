---
# Service account for the compliance scanner. The IRSA role ARN annotation is
# injected at apply time by scripts/run-trivy-cluster.sh, which reads the ARN
# from terraform output — it is not hardcoded here because it contains the
# account id and cluster name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance-scanner
  namespace: compliance
  labels:
    app: compliance-scanner
automountServiceAccountToken: true
---
# Read-only cluster access. Deliberately NOT cluster-admin: the scanner
# inspects configuration, it never mutates it. 'get/list' only, no 'watch'
# (nothing needs a long-lived stream), no 'create/update/delete/patch'.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compliance-scanner-read
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
      - services
      - serviceaccounts
      - configmaps
      - persistentvolumes
      - persistentvolumeclaims
      - limitranges
      - resourcequotas
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compliance-scanner-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compliance-scanner-read
subjects:
  - kind: ServiceAccount
    name: compliance-scanner
    namespace: compliance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bench
  namespace: kube-bench
  labels:
    app: kube-bench
automountServiceAccountToken: true
---
# kube-bench reads node and kubelet configuration. It needs no API write
# access whatsoever.
#
# NOTE ON 'nodes/proxy' (KSV-0047): this subresource is deliberately NOT
# granted. Access to nodes/proxy allows a holder to call the kubelet API
# directly, which bypasses the API server's authorization and audit logging
# and is a recognised privilege-escalation path.
#
# kube-bench does not need it: the CIS EKS Benchmark reads kubelet
# configuration, systemd units and certificate files FROM THE NODE
# FILESYSTEM through the Job's read-only hostPath mounts, and reads kubelet
# process arguments through the host PID namespace. Neither path touches the
# kubelet API. scripts/run-kube-bench.sh likewise only uses
# apply/wait/get pods/logs against the API server.
#
# It was granted defensively in the first revision and removed once verified
# unused — an unused permission is still a granted permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-bench-read
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-bench-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-bench-read
subjects:
  - kind: ServiceAccount
    name: kube-bench
    namespace: kube-bench
