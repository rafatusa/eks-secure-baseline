---
# Quotas bound the blast radius of a runaway or hostile workload: without
# them a single namespace can consume the whole node group.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compliance-quota
  namespace: compliance
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    persistentvolumeclaims: "2"
---
# Defaults for containers that omit resource specs, plus an upper bound.
# Without a LimitRange, a container with no requests is scheduled as
# best-effort and is first to be evicted under pressure.
apiVersion: v1
kind: LimitRange
metadata:
  name: compliance-limits
  namespace: compliance
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kube-bench-quota
  namespace: kube-bench
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kube-bench-limits
  namespace: kube-bench
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
