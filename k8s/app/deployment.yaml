---
# Dedicated service account. The default service account in a namespace is
# shared by every workload, so binding anything to it grants it broadly.
# This one holds no RBAC at all — the app makes no Kubernetes API calls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: baseline-app
  namespace: app
  labels:
    app.kubernetes.io/name: baseline-app
# The app never calls the Kubernetes API, so it has no use for a mounted
# token. Not mounting one means a compromised container has no cluster
# credential to replay.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baseline-app
  namespace: app
  labels:
    app.kubernetes.io/name: baseline-app
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: baseline-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current replica count during a rollout: a new
      # pod must pass its readiness probe before an old one is removed.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baseline-app
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: baseline-app
      automountServiceAccountToken: false

      # Pod-level security context. Under the 'restricted' standard these are
      # admission requirements, not hardening extras — omitting any of them
      # means the pod is refused outright.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Spread replicas across availability zones. With both pods on one node
      # a single node failure takes the whole service down while the ALB
      # still has healthy targets registered, producing 502s rather than a
      # clean failover. ScheduleAnyway keeps scheduling possible on a
      # two-node cluster where a strict constraint could block a rollout.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: baseline-app

      # Matches spring.lifecycle.timeout-per-shutdown-phase (20s) with headroom
      # for the pod to be removed from the ALB target group first.
      terminationGracePeriodSeconds: 30

      containers:
        - name: app
          # Replaced by the pipeline with the ECR URL and the commit SHA.
          # Never deployed by a floating tag: ':latest' makes the running
          # version unknowable and defeats the immutable-tag policy on ECR.
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # Downward API: lets the landing page show which replica served
            # the request, which is the quickest visual confirmation that the
            # load balancer is spreading traffic.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_VERSION
              value: VERSION_PLACEHOLDER

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

          # A JVM web app needs a writable temp directory. An emptyDir keeps
          # the root filesystem read-only while still satisfying that, and the
          # contents die with the pod.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # Startup probe absorbs JVM boot time. Without it, a liveness probe
          # tuned for steady state fires during startup and restarts the pod
          # before it ever becomes ready — the classic JVM-on-Kubernetes
          # crash loop that looks like an application bug.
          # 30 x 5s = up to 150s to start before it is declared failed.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          # Readiness gates traffic: a pod failing this is pulled from the
          # Service endpoints and the ALB target group.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Liveness restarts a wedged process. Deliberately more tolerant
          # than readiness: a momentary stall should remove a pod from
          # rotation, not kill it.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              # Memory limit only. A CPU limit would throttle the JVM during
              # startup — when it needs the most CPU — and lengthen every
              # rollout for no benefit on a cluster with CPU headroom.
              # The container's MaxRAMPercentage=70 sizes the heap from this.
              memory: 768Mi

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
# Keeps at least one replica serving during voluntary disruptions such as a
# node drain during a cluster upgrade. Without this, draining a two-node
# cluster can evict both pods simultaneously.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: baseline-app
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: baseline-app
