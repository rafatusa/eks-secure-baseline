---
# kube-bench running the CIS Amazon EKS Benchmark.
#
# Scope note: on EKS the control plane is managed by AWS and its component
# flags are NOT inspectable from inside the cluster. The 'eks-stig-kubernetes'
# and master-node sections of the generic CIS Kubernetes Benchmark therefore
# do not apply. This job runs the 'eks-1.5.0' profile, which covers exactly
# the controls a customer is responsible for: node configuration, kubelet
# settings, RBAC, and cluster policies.
#
# ---------------------------------------------------------------------------
# DO NOT ADD --targets  (this cost a failed compliance stage)
# ---------------------------------------------------------------------------
# An earlier revision passed:
#     --targets=node,policies,managedservices
# and kube-bench refused to start with:
#     error validating targets: No targets configured for eks-1.5.0
#
# kube-bench validates every requested target against the target list the
# SELECTED BENCHMARK declares in its own cfg, and those names differ between
# benchmark versions. Naming them here duplicates a value that upstream owns,
# so the manifest silently rots whenever the benchmark version is bumped.
#
# Omitting --targets makes kube-bench run the benchmark's OWN default target
# set, which is always internally consistent with --benchmark. The failure
# mode is also much better: an unsupported benchmark name fails immediately
# and explicitly, rather than a valid benchmark failing on a stale target.
#
# Note the blast radius of the original bug: with backoffLimit: 0 the pod
# failed in seconds, but the collecting script waited the full 600s timeout
# before reporting it. See scripts/run-kube-bench.sh, which now fails fast.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# WHY THIS MANIFEST HAS SUPPRESSED TRIVY FINDINGS
# (.trivyignore-kube-bench, applied ONLY when scanning k8s/compliance/)
# ---------------------------------------------------------------------------
# Trivy flags this Job for hostPID, hostPath volumes and runAsUser: 0
# (KSV-0010, KSV-0012, KSV-0023, KSV-0105, KSV-0118). Those findings are
# CORRECT for an ordinary workload and are deliberately NOT waived for one.
#
# They are unavoidable for a NODE-LEVEL CIS SCANNER specifically:
#   * hostPID  — kubelet process arguments are only visible in the host PID
#                namespace; CIS 4.1.x/4.2.x check exactly those arguments.
#   * hostPath — the benchmark audits files on the node itself
#                (/var/lib/kubelet/config.json, /etc/kubernetes/*, systemd
#                unit files). They cannot be read from a container filesystem.
#   * runAsUser: 0 — those files are root-owned with 0600/0644 permissions.
#
# A kube-bench pod that satisfied these checks could not perform the scan:
# it would report every node control as unreadable. The privileges are the
# scanner's function, not an oversight.
#
# The privileges are minimised to exactly what the scan needs:
#   privileged: false, allowPrivilegeEscalation: false,
#   readOnlyRootFilesystem: true, ALL capabilities dropped,
#   every hostPath mount readOnly: true, seccompProfile: RuntimeDefault,
#   automountServiceAccountToken scoped, RBAC limited to get/list
#   (and NOT nodes/proxy — see k8s/hardening/rbac.yaml).
#
# Blast radius is contained by isolation, not by trust:
#   * runs in its own 'kube-bench' namespace labelled PSA 'privileged',
#     while workload namespaces stay PSA 'restricted';
#   * its ServiceAccount has read-only RBAC (get/list) and no write verbs;
#   * it is a Job, not a long-running Deployment — it exits after scanning;
#   * ttlSecondsAfterFinished removes it an hour later.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: kube-bench
  labels:
    app: kube-bench
spec:
  # Do not retry: a failed scan should surface, not be masked by a retry that
  # happens to land on a different node.
  backoffLimit: 0
  # Clean up 1 hour after completion so repeated runs do not accumulate.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: kube-bench
    spec:
      serviceAccountName: kube-bench
      restartPolicy: Never

      # hostPID is required: kube-bench inspects kubelet process arguments,
      # which are only visible in the host PID namespace. This is why the job
      # runs in its own 'privileged' PSA namespace rather than 'restricted'.
      hostPID: true

      # Pod-level security context. seccompProfile is set here so it applies
      # to every container in the pod. This one IS remediable without
      # breaking the scan, so it is fixed rather than suppressed.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.9.1
          imagePullPolicy: IfNotPresent

          command:
            - kube-bench
          args:
            - run
            # --targets is deliberately omitted: the benchmark declares its
            # own default targets. See the note at the top of this file.
            - --benchmark=eks-1.5.0
            - --json

          securityContext:
            # kube-bench reads root-owned kubelet config files, so UID 0 is
            # required. Everything that can be locked down, is.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            # Every host mount is READ-ONLY: the scanner must never be able to
            # modify the configuration it is auditing.
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
            type: Directory
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
            type: DirectoryOrCreate
        # Writable scratch space, needed because the root filesystem is
        # mounted read-only.
        - name: tmp
          emptyDir: {}
