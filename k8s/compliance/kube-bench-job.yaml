---
# kube-bench running the CIS Amazon EKS Benchmark.
#
# Scope note: on EKS the control plane is managed by AWS and its component
# flags are NOT inspectable from inside the cluster. The master-node sections
# of the generic CIS Kubernetes Benchmark therefore do not apply. This job
# runs the 'eks-1.2.0' profile, which covers exactly the controls a customer
# is responsible for: worker node configuration, kubelet settings, RBAC, and
# cluster policies.
#
# ---------------------------------------------------------------------------
# BENCHMARK NAME: pin it to one the IMAGE ACTUALLY SHIPS
# ---------------------------------------------------------------------------
# kube-bench v0.9.1 ships exactly these EKS benchmark definitions:
#     eks-1.0.1   eks-1.1.0   eks-1.2.0
# (verified against cfg/ in the v0.9.1 tag upstream). eks-1.2.0 is the newest
# and is the one pinned below. Its cfg directory contains real control files:
#     config.yaml controlplane.yaml managedservices.yaml master.yaml
#     node.yaml policies.yaml
# node.yaml declares `version: "eks-1.2.0"` / `type: "node"` with the scored
# 3.1.x file-permission and 3.2.x kubelet checks this project exists to run.
#
# TWO FAILED COMPLIANCE STAGES CAME FROM GETTING THIS WRONG — read before
# changing the line:
#
#   1. An earlier revision named a benchmark that DOES NOT EXIST in this
#      image ('eks-1.5.0'). kube-bench does not reject an unknown benchmark
#      with a clear "unknown benchmark" error — it resolves it to an EMPTY
#      target set and then fails target validation:
#          error validating targets: No targets configured for eks-1.5.0
#      That message points at --targets, which is NOT the cause. The cause is
#      the benchmark name. Do not debug this by changing targets.
#
#   2. The same revision also passed:
#          --targets=node,policies,managedservices
#      Removing those changed nothing, precisely because the benchmark name
#      was the real defect. --targets stays omitted anyway: each benchmark
#      declares its own default target set, which is by construction
#      consistent with --benchmark, whereas a hardcoded list here silently
#      rots whenever the benchmark version is bumped.
#
# RULE: --benchmark must name a directory that exists in the pinned image's
# cfg/. If the image tag below is bumped, re-verify the available benchmark
# names for that tag before changing this value.
#
# Note the blast radius of the original bug: with backoffLimit: 0 the pod
# failed in seconds, but the collecting script waited the full 600s timeout
# before reporting it. See scripts/run-kube-bench.sh, which now fails fast
# by racing the complete and failed conditions and printing pod logs first.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# WHY THIS MANIFEST HAS SUPPRESSED TRIVY FINDINGS
# (.trivyignore-kube-bench, applied ONLY when scanning k8s/compliance/)
# ---------------------------------------------------------------------------
# Trivy flags this Job for hostPID, hostPath volumes and runAsUser: 0
# (KSV-0010, KSV-0012, KSV-0023, KSV-0105, KSV-0118). Those findings are
# CORRECT for an ordinary workload and are deliberately NOT waived for one.
#
# They are unavoidable for a NODE-LEVEL CIS SCANNER specifically:
#   * hostPID  — kubelet process arguments are only visible in the host PID
#                namespace; CIS 3.2.x checks exactly those arguments.
#   * hostPath — the benchmark audits files on the node itself
#                (/var/lib/kubelet/config.json, /etc/kubernetes/*, systemd
#                unit files). They cannot be read from a container filesystem.
#   * runAsUser: 0 — those files are root-owned with 0600/0644 permissions.
#
# A kube-bench pod that satisfied these checks could not perform the scan:
# it would report every node control as unreadable. The privileges are the
# scanner's function, not an oversight.
#
# The privileges are minimised to exactly what the scan needs:
#   privileged: false, allowPrivilegeEscalation: false,
#   readOnlyRootFilesystem: true, ALL capabilities dropped,
#   every hostPath mount readOnly: true, seccompProfile: RuntimeDefault,
#   automountServiceAccountToken scoped, RBAC limited to get/list
#   (and NOT nodes/proxy — see k8s/hardening/rbac.yaml).
#
# Blast radius is contained by isolation, not by trust:
#   * runs in its own 'kube-bench' namespace labelled PSA 'privileged',
#     while workload namespaces stay PSA 'restricted';
#   * its ServiceAccount has read-only RBAC (get/list) and no write verbs;
#   * it is a Job, not a long-running Deployment — it exits after scanning;
#   * ttlSecondsAfterFinished removes it an hour later.
#
# LIFECYCLE OWNERSHIP: this Job is applied by scripts/run-kube-bench.sh ONLY,
# which deletes any prior Job before applying. Kubernetes Jobs are immutable
# (spec.template cannot change after creation), so a second caller that
# applies without deleting will fail for the whole ttlSecondsAfterFinished
# window after any spec edit. configure-cluster.sh deliberately does NOT
# apply k8s/compliance/ for this reason.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: kube-bench
  labels:
    app: kube-bench
spec:
  # Do not retry: a failed scan should surface, not be masked by a retry that
  # happens to land on a different node.
  backoffLimit: 0
  # Clean up 1 hour after completion so repeated runs do not accumulate.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: kube-bench
    spec:
      serviceAccountName: kube-bench
      restartPolicy: Never

      # hostPID is required: kube-bench inspects kubelet process arguments,
      # which are only visible in the host PID namespace. This is why the job
      # runs in its own 'privileged' PSA namespace rather than 'restricted'.
      hostPID: true

      # Pod-level security context. seccompProfile is set here so it applies
      # to every container in the pod. This one IS remediable without
      # breaking the scan, so it is fixed rather than suppressed.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.9.1
          imagePullPolicy: IfNotPresent

          command:
            - kube-bench
          args:
            - run
            # --targets is deliberately omitted: the benchmark declares its
            # own default targets. See the note at the top of this file.
            # --benchmark MUST name a benchmark this image ships; v0.9.1
            # provides eks-1.0.1, eks-1.1.0 and eks-1.2.0 only.
            - --benchmark=eks-1.2.0
            - --json

          securityContext:
            # kube-bench reads root-owned kubelet config files, so UID 0 is
            # required. Everything that can be locked down, is.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            # Every host mount is READ-ONLY: the scanner must never be able to
            # modify the configuration it is auditing.
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
            type: Directory
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
            type: DirectoryOrCreate
        # Writable scratch space, needed because the root filesystem is
        # mounted read-only.
        - name: tmp
          emptyDir: {}
